; Config for tools\release_create.bat (release-tool create).
; Only values that differ from release-tool's defaults - see
; release-tool/examples/release_create.ini for every key.
; NOTE: configparser does not strip inline comments; keep them on their own lines.

[Release]
scope = fman
; Use plain semantic versions for tags and release labels.
versioning = semver
; Roll the patch into the minor after version x.y.10.
semver_patch_max = 10

[Bats]
translate = tools/translate_release_notes.bat
; No publish bat: the GitHub Release must be created after the tag is pushed, and
; the publish gate runs before that. The [GitHubRelease] gate below runs after.

[GitHubRelease]
enabled = true
assets = target/fmanSetup.exe, target/fmanPortable.zip
; Pinned: this repo is a fork, so gh could otherwise resolve to the upstream parent.
repo = BenjaminKobjolke/fman
; Mirrored by the --title in tools/github_release.bat - keep the two in sync.
title_format = fman++ {label}
